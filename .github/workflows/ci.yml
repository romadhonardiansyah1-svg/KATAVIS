name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks menelusuri riwayat commit, bukan hanya pohon kerja.
          # Checkout dangkal bawaan aksi ini hanya membawa satu commit
          # sehingga riwayat lama tidak pernah tersapu.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: pnpm run test -- --reporter=default --reporter=json --outputFile=test-results.json

      - name: Contrast verification (TC-A11Y-02)
        run: python tools/contrast.py

      - name: Cross-reference verification
        run: python tools/check_refs.py

      # `|| true` DIHAPUS dengan sengaja. Sebelumnya langkah ini selalu
      # hijau apa pun hasilnya, sehingga kerentanan tinggi tidak pernah
      # menggagalkan apa pun — dan `pnpm audit` memang menemukan `sharp`
      # serta `qs` yang rentan, yang baru tertangkap setelah diperiksa
      # manual. Ambangnya `high`: `moderate` pada dependensi pengembangan
      # muncul jauh lebih sering daripada dapat ditindaklanjuti, dan gerbang
      # yang berisik akan dimatikan orang.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # Rahasia yang ter-commit tidak dapat ditarik kembali dengan
      # menghapusnya di commit berikutnya — ia tetap ada di riwayat. Karena
      # itu diperiksa pada setiap perubahan, bukan sesekali.
      #
      # `fetch-depth: 0` diperlukan: gitleaks menelusuri riwayat, dan
      # checkout dangkal bawaan aksi ini hanya membawa satu commit.
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration tests (workerd + D1 + R2)
        run: pnpm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: pnpm run build

      - name: E2E tests
        run: pnpm run test:e2e
        env:
          CI: "true"
          BASE_URL: http://localhost:3000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Playwright menulis laporan HTML ke `test-output/html`
          # (`playwright.config.ts`). Sebelumnya langkah ini menunjuk
          # `playwright-report/`, yang tidak pernah dibuat oleh konfigurasi
          # mana pun — jadi unggahannya selalu kosong, dan tidak ada yang
          # menyadarinya sampai diperiksa manual.
          path: |
            test-output/html/
            test-output/results.json
          retention-days: 14
